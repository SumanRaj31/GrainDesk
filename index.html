<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GrainDesk — Shop Billing</title>
<style>
:root{--ink:#202a25;--muted:#718078;--line:#e5ebe6;--bg:#f5f7f4;--green:#246b4b;--green2:#e9f3ed;--white:#fff;--red:#b94a48;--amber:#a66b16;--shadow:0 8px 24px #2033280a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:white;font-weight:650}button.secondary{background:#eef2ef;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff0ef;color:var(--red);border:1px solid #f2d7d5}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-size:18px;font-weight:800}.logo{width:34px;height:34px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#536158;text-align:left;font-weight:600;padding:11px 12px}.nav button.active,.nav button:hover{background:var(--green2);color:var(--green)}.side-note{margin-top:auto;color:var(--muted);font-size:11px;padding:8px}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top small{color:var(--muted)}.content{padding:28px;max-width:1400px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.pagehead h1{font-size:25px;margin:0 0 4px}.sub{color:var(--muted);margin:0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.metric-label{font-size:12px;color:var(--muted);font-weight:600}.metric{font-size:25px;font-weight:800;margin-top:7px}.metric-foot{font-size:11px;color:var(--muted);margin-top:3px}.panel h2{font-size:16px;margin:0 0 14px}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}td{font-size:13px}.empty{text-align:center;color:var(--muted);padding:30px}.pill{display:inline-block;background:var(--green2);color:var(--green);padding:4px 8px;border-radius:30px;font-size:11px;font-weight:700}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:5px}.field label{font-size:12px;color:#536158;font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4de;border-radius:8px;padding:10px;background:#fff;color:var(--ink);min-width:0}.field input:focus,.field select:focus{outline:2px solid #c5dfce;border-color:#80ae91}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.inline{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.inline .field{flex:1;min-width:120px}.muted{color:var(--muted)}.right{text-align:right}.total{font-size:22px;font-weight:800}.notice{padding:12px 14px;border-radius:10px;background:#fff8e9;color:#805719;font-size:12px;margin-bottom:16px}.success{color:var(--green)}.danger-text{color:var(--red)}.bill-lines{margin-top:14px}.bill-lines input,.bill-lines select{padding:7px;border:1px solid var(--line);border-radius:7px;width:100%}.bill-lines td{padding:7px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#fff;color:var(--muted);border:1px solid var(--line)}.tabs button.active{background:var(--green2);color:var(--green);border-color:#c9dfd0}.hidden{display:none!important}.small{font-size:11px}.receipt{display:none}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:12px;border-right:0;border-bottom:1px solid var(--line);gap:10px}.brand{padding:4px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.side-note{display:none}.top{padding:0 16px}.content{padding:18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.metric{font-size:20px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.pagehead{flex-direction:column}.top{height:56px}}
@media print{body{background:#fff}.side,.top,.no-print,.pagehead,.notice{display:none!important}.app{display:block}.content{padding:0;max-width:none}.receipt{display:block}.print-hide{display:none!important}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand"><span class="logo">G</span> GrainDesk</div><nav class="nav" id="nav">
<button class="active" data-page="dashboard">▦ &nbsp; Dashboard</button><button data-page="billing">▤ &nbsp; Billing</button><button data-page="inventory">▧ &nbsp; Inventory</button><button data-page="purchases">＋ &nbsp; Purchases</button><button data-page="expenses">↘ &nbsp; Expenses</button><button data-page="reports">▥ &nbsp; Reports</button><button data-page="settings">⚙ &nbsp; Settings</button>
</nav><div class="side-note">Basic version · Data saved in this browser on this device.</div></aside>
<main class="main"><header class="top"><div><strong id="shopTitle">My Rice & Millet Shop</strong><br><small id="today"></small></div><div class="small muted">Local billing workspace</div></header><div class="content" id="content"></div></main></div>
<script>
const KEY='graindesk_v1';const today=()=>new Date().toISOString().slice(0,10);const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});const num=n=>Number(n)||0;const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let db=load();function load(){try{return JSON.parse(localStorage.getItem(KEY))||{products:[],purchases:[],sales:[],expenses:[],settings:{shop:'My Rice & Millet Shop',invoice:'INV'}}}catch(e){return {products:[],purchases:[],sales:[],expenses:[],settings:{shop:'My Rice & Millet Shop',invoice:'INV'}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('shopTitle').textContent=db.settings.shop||'My Rice & Millet Shop'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stock(p){return db.purchases.filter(x=>x.productId===p.id).reduce((a,x)=>a+x.kg,0)-db.sales.reduce((a,s)=>a+s.items.filter(i=>i.productId===p.id).reduce((b,i)=>b+i.kg,0),0)}
function avgCost(p){let buys=db.purchases.filter(x=>x.productId===p.id);let kg=buys.reduce((a,x)=>a+x.kg,0),cost=buys.reduce((a,x)=>a+x.cost,0);return kg?cost/kg:num(p.manualCost)}
function page(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));({dashboard, billing, inventory, purchases, expenses, reports, settings}[name]||dashboard)()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)page(b.dataset.page)});document.getElementById('today').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});save();
function head(title,desc,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p class="sub">${desc}</p></div>${action}</div>`}
function dashboard(){let d=today(),sales=db.sales.filter(s=>s.date===d),rev=sales.reduce((a,s)=>a+s.total,0),cogs=sales.reduce((a,s)=>a+s.cogs,0),exp=db.expenses.filter(x=>x.date===d).reduce((a,x)=>a+x.amount,0),totalStock=db.products.reduce((a,p)=>a+Math.max(0,stock(p))*avgCost(p),0);document.getElementById('content').innerHTML=head('Dashboard','A quick view of your shop today.')+`<div class="cards"><div class="card"><div class="metric-label">Today's sales</div><div class="metric">${money(rev)}</div><div class="metric-foot">${sales.length} bills</div></div><div class="card"><div class="metric-label">Gross profit</div><div class="metric">${money(rev-cogs)}</div><div class="metric-foot">Sales less estimated product cost</div></div><div class="card"><div class="metric-label">Today's expenses</div><div class="metric">${money(exp)}</div><div class="metric-foot">Recorded expenses</div></div><div class="card"><div class="metric-label">Stock value</div><div class="metric">${money(totalStock)}</div><div class="metric-foot">At weighted average cost</div></div></div><div class="grid2"><section class="panel"><h2>Recent bills</h2>${sales.length?`<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Time</th><th>Items</th><th class="right">Total</th></tr></thead><tbody>${sales.slice().reverse().slice(0,8).map(s=>`<tr><td>${esc(s.invoice)}</td><td>${esc(s.time||'')}</td><td>${s.items.length}</td><td class="right">${money(s.total)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No bills recorded today.</div>'}</section><section class="panel"><h2>Stock overview</h2>${db.products.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Available</th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${stock(p).toFixed(2)} kg</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Add products to start tracking stock.</div>'}</section></div>`}
function billing(){let rows=[];document.getElementById('content').innerHTML=head('New bill','Add products by full bag or loose kilograms.')+`<div class="notice">Stock is deducted in kilograms when a bill is saved. Full-bag and loose selling prices can be different.</div><section class="panel"><div class="formgrid"><div class="field"><label>Customer name (optional)</label><input id="cust" placeholder="Walk-in customer"></div><div class="field"><label>Payment method</label><select id="pay"><option>Cash</option><option>UPI</option><option>Bank transfer</option></select></div></div><div class="inline" style="margin-top:16px"><div class="field"><label>Product</label><select id="prod">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${stock(p).toFixed(2)} kg available</option>`).join('')}</select></div><div class="field" style="max-width:145px"><label>Sale type</label><select id="type"><option value="loose">Loose (KG)</option><option value="bag">Full bag</option></select></div><div class="field" style="max-width:120px"><label id="qtyLabel">Quantity (KG)</label><input id="qty" type="number" min="0.01" step="0.01" value="1"></div><button type="button" onclick="addLine()">Add item</button></div><div class="table-wrap bill-lines"><table><thead><tr><th>Product</th><th>Type</th><th>Qty / bags</th><th>Weight</th><th>Rate</th><th>Total</th><th></th></tr></thead><tbody id="billRows"><tr><td colspan="7" class="empty">No items added yet.</td></tr></tbody></table></div><div class="actions" style="justify-content:space-between;align-items:center"><div class="muted small" id="billCount">0 items</div><div class="total" id="billTotal">Total: ₹0.00</div></div><div class="actions"><button onclick="saveBill()">Save & print bill</button><button class="secondary" onclick="page('dashboard')">Cancel</button></div></section>`;if(!db.products.length)document.getElementById('prod').innerHTML='<option value="">Add products in Inventory first</option>';document.getElementById('type').onchange=()=>{let p=db.products.find(x=>x.id===document.getElementById('prod').value);document.getElementById('qtyLabel').textContent=document.getElementById('type').value==='bag'?'Number of bags':'Quantity (KG)';document.getElementById('qty').value=1};window.billLines=rows}
function addLine(){let p=db.products.find(x=>x.id===document.getElementById('prod').value);if(!p)return alert('Please add a product first.');let type=document.getElementById('type').value,q=num(document.getElementById('qty').value);if(q<=0)return alert('Enter a valid quantity.');let kg=type==='bag'?q*p.bagKg:q,rate=type==='bag'?p.bagPrice:p.loosePrice,amount=type==='bag'?q*rate:q*rate;if(kg>stock(p)+0.0001)return alert(`Not enough stock. Available: ${stock(p).toFixed(2)} kg.`);window.billLines.push({productId:p.id,name:p.name,type,qty:q,kg,rate,amount,cost:avgCost(p)*kg});renderBillRows()}
function renderBillRows(){let el=document.getElementById('billRows');el.innerHTML=window.billLines.length?window.billLines.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${x.type==='bag'?'Full bag':'Loose'}</td><td>${x.qty}</td><td>${x.kg.toFixed(2)} kg</td><td>${money(x.rate)}${x.type==='loose'?'/kg':''}</td><td>${money(x.amount)}</td><td><button class="danger" style="padding:5px 8px" onclick="removeLine(${i})">×</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No items added yet.</td></tr>';document.getElementById('billTotal').textContent='Total: '+money(window.billLines.reduce((a,x)=>a+x.amount,0));document.getElementById('billCount').textContent=window.billLines.length+' line items'}function removeLine(i){window.billLines.splice(i,1);renderBillRows()}
function saveBill(){if(!window.billLines.length)return alert('Add at least one item.');for(let x of window.billLines){let p=db.products.find(p=>p.id===x.productId);if(x.kg>stock(p)+0.0001)return alert('Stock changed. Please check '+p.name)}let n=db.sales.length+1,s={id:id(),invoice:(db.settings.invoice||'INV')+'-'+String(n).padStart(5,'0'),date:today(),time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),customer:document.getElementById('cust').value,payment:document.getElementById('pay').value,items:window.billLines,total:window.billLines.reduce((a,x)=>a+x.amount,0),cogs:window.billLines.reduce((a,x)=>a+x.cost,0)};db.sales.push(s);save();printReceipt(s);page('billing')}
function printReceipt(s){let w=window.open('','_blank','width=420,height=650');if(!w){alert('Please allow pop-ups to print the receipt. Bill was saved.');return}w.document.write(`<html><head><title>${s.invoice}</title><style>body{font:13px Arial;padding:20px;color:#111}h2,p{text-align:center;margin:4px}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:7px 2px;border-bottom:1px dashed #aaa;text-align:left} .r{text-align:right}.total{font-size:18px;font-weight:bold;text-align:right;margin-top:16px}</style></head><body><h2>${esc(db.settings.shop)}</h2><p>Sales receipt</p><hr><p style="text-align:left">Invoice: ${s.invoice}<br>Date: ${s.date} ${s.time}<br>Customer: ${esc(s.customer||'Walk-in')}</p><table><tr><th>Item</th><th>Qty</th><th class="r">Amount</th></tr>${s.items.map(x=>`<tr><td>${esc(x.name)}<br><small>${x.type==='bag'?'Full bag':'Loose'}</small></td><td>${x.kg} kg</td><td class="r">${money(x.amount)}</td></tr>`).join('')}</table><div class="total">Total: ${money(s.total)}</div><p style="margin-top:20px">Paid by ${esc(s.payment)}<br>Thank you. Visit again!</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function inventory(){document.getElementById('content').innerHTML=head('Inventory & products','Set bag size, purchase cost and separate selling prices.')+`<div class="grid2"><section class="panel"><h2>Add a product</h2><form id="productForm"><div class="formgrid"><div class="field full"><label>Product name</label><input name="name" required placeholder="e.g. Ponni Rice"></div><div class="field"><label>Default bag weight (KG)</label><input name="bagKg" type="number" min="0.01" step="0.01" value="30" required></div><div class="field"><label>Manual cost per KG (optional)</label><input name="manualCost" type="number" min="0" step="0.01" placeholder="Used until purchase is entered"></div><div class="field"><label>Loose selling price / KG (₹)</label><input name="loosePrice" type="number" min="0" step="0.01" required></div><div class="field"><label>Full bag selling price (₹)</label><input name="bagPrice" type="number" min="0" step="0.01" required></div></div><div class="actions"><button>Add product</button></div></form></section><section class="panel"><h2>Inventory method</h2><p class="muted">All stock is stored in kilograms. Each purchase can have its own bag count and actual bag weight. Full-bag sales use the product's default bag weight; loose sales use the entered KG.</p><div class="notice">Purchase cost is entered on every purchase. Current average cost per KG is calculated from total purchase value ÷ total purchased KG.</div></section></div><section class="panel" style="margin-top:16px"><h2>Product list</h2>${productTable()}</section>`;document.getElementById('productForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p={id:id(),name:f.get('name').trim(),bagKg:num(f.get('bagKg')),manualCost:num(f.get('manualCost')),loosePrice:num(f.get('loosePrice')),bagPrice:num(f.get('bagPrice'))};if(db.products.some(x=>x.name.toLowerCase()===p.name.toLowerCase()))return alert('Product already exists.');db.products.push(p);save();inventory()}}
function productTable(){return db.products.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Stock</th><th>Avg cost/KG</th><th>Loose/KG</th><th>Full bag</th><th>Bag size</th></tr></thead><tbody>${db.products.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${stock(p).toFixed(2)} kg</td><td>${money(avgCost(p))}</td><td>${money(p.loosePrice)}</td><td>${money(p.bagPrice)}</td><td>${p.bagKg} kg</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No products yet. Add your first product above.</div>'}
function purchases(){document.getElementById('content').innerHTML=head('Stock purchases','Record each supplier purchase. Different bag weights are supported.')+`<section class="panel"><h2>Record a purchase</h2><form id="purchaseForm"><div class="formgrid"><div class="field"><label>Product</label><select name="productId" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Purchase date</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Number of bags</label><input name="bags" type="number" min="0.01" step="0.01" value="1" required></div><div class="field"><label>Weight per bag (KG)</label><input name="bagKg" type="number" min="0.01" step="0.01" value="30" required></div><div class="field"><label>Total purchase cost (₹)</label><input name="cost" type="number" min="0" step="0.01" required placeholder="Total amount paid for this stock"></div><div class="field"><label>Supplier / note (optional)</label><input name="note" placeholder="Supplier name"></div></div><div class="actions"><button ${db.products.length?'':'disabled'}>Save purchase</button></div></form></section><section class="panel" style="margin-top:16px"><h2>Purchase history</h2>${db.purchases.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Bags</th><th>Total KG</th><th>Purchase cost</th><th>Cost/KG</th></tr></thead><tbody>${db.purchases.slice().reverse().map(x=>{let p=db.products.find(p=>p.id===x.productId);return `<tr><td>${x.date}</td><td>${esc(p?.name||'Deleted product')}</td><td>${x.bags}</td><td>${x.kg.toFixed(2)}</td><td>${money(x.cost)}</td><td>${money(x.cost/x.kg)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No purchases recorded.</div>'}</section>`;document.getElementById('purchaseForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),bags=num(f.get('bags')),kg=bags*num(f.get('bagKg')),cost=num(f.get('cost'));if(!kg||cost<0)return alert('Check purchase quantity and cost.');db.purchases.push({id:id(),productId:f.get('productId'),date:f.get('date'),bags,bagKg:num(f.get('bagKg')),kg,cost,note:f.get('note')});save();purchases()}}
function expenses(){document.getElementById('content').innerHTML=head('Expenses','Record day-to-day shop operating expenses.')+`<section class="panel"><h2>Add expense</h2><form id="expenseForm"><div class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Category</label><select name="category"><option>Rent</option><option>Electricity</option><option>Transport</option><option>Labour</option><option>Packaging</option><option>Maintenance</option><option>Other</option></select></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Payment method</label><select name="payment"><option>Cash</option><option>UPI</option><option>Bank transfer</option></select></div><div class="field full"><label>Description</label><input name="note" placeholder="Optional note"></div></div><div class="actions"><button>Add expense</button></div></form></section><section class="panel" style="margin-top:16px"><h2>Expense history</h2>${db.expenses.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Payment</th><th class="right">Amount</th></tr></thead><tbody>${db.expenses.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td>${esc(x.note)}</td><td>${esc(x.payment)}</td><td class="right">${money(x.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No expenses recorded.</div>'}</section>`;document.getElementById('expenseForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.expenses.push({id:id(),date:f.get('date'),category:f.get('category'),amount:num(f.get('amount')),payment:f.get('payment'),note:f.get('note')});save();expenses()}}
function reports(){let from=new Date();from.setDate(1);let start=from.toISOString().slice(0,10),sales=db.sales.filter(s=>s.date>=start),rev=sales.reduce((a,s)=>a+s.total,0),cogs=sales.reduce((a,s)=>a+s.cogs,0),ex=db.expenses.filter(x=>x.date>=start).reduce((a,x)=>a+x.amount,0),profit=rev-cogs-ex;let allStock=db.products.reduce((a,p)=>a+Math.max(0,stock(p))*avgCost(p),0);document.getElementById('content').innerHTML=head('Reports & accounts','A basic month-to-date trading summary.')+`<div class="notice">This is an operational summary, not yet a complete statutory Profit & Loss or Balance Sheet. Opening cash, bank, capital, loans, assets and supplier balances will be added as we refine accounting.</div><section class="panel"><h2>Profit & Loss · ${new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2><table><tbody><tr><td>Sales revenue</td><td class="right">${money(rev)}</td></tr><tr><td>Less: Cost of goods sold</td><td class="right">(${money(cogs)})</td></tr><tr><td><strong>Gross profit</strong></td><td class="right"><strong>${money(rev-cogs)}</strong></td></tr><tr><td>Less: Operating expenses</td><td class="right">(${money(ex)})</td></tr><tr><td><strong>Estimated net operating profit</strong></td><td class="right"><strong class="${profit>=0?'success':'danger-text'}">${money(profit)}</strong></td></tr></tbody></table></section><div class="grid2" style="margin-top:16px"><section class="panel"><h2>Inventory valuation</h2><div class="metric">${money(allStock)}</div><p class="muted small">Estimated remaining stock at weighted average purchase cost.</p></section><section class="panel"><h2>Transaction counts</h2><p>Sales bills: <strong>${db.sales.length}</strong></p><p>Purchase entries: <strong>${db.purchases.length}</strong></p><p>Expense entries: <strong>${db.expenses.length}</strong></p></section></div><div class="actions no-print"><button class="secondary" onclick="exportData()">Export backup (JSON)</button><button class="secondary" onclick="exportCsv()">Export sales (CSV)</button></div>`}
function settings(){document.getElementById('content').innerHTML=head('Settings','Shop identity and data backup.')+`<section class="panel"><h2>Shop details</h2><form id="settingsForm"><div class="formgrid"><div class="field"><label>Shop name</label><input name="shop" value="${esc(db.settings.shop)}" required></div><div class="field"><label>Invoice prefix</label><input name="invoice" value="${esc(db.settings.invoice)}" required></div></div><div class="actions"><button>Save settings</button></div></form></section><section class="panel" style="margin-top:16px"><h2>Data & backup</h2><p class="muted">This basic version stores data in this browser's local storage. Clearing browser data or changing devices can make records unavailable. Export a backup regularly.</p><div class="actions"><button class="secondary" onclick="exportData()">Download data backup</button><label class="secondary" style="padding:10px 14px;border-radius:9px;cursor:pointer">Restore backup<input type="file" accept="application/json" hidden onchange="importData(event)"></label><button class="danger" onclick="resetData()">Reset all data</button></div></section>`;document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.settings.shop=f.get('shop');db.settings.invoice=f.get('invoice');save();settings()}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='graindesk-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.sales||!x.purchases)throw Error();db=x;save();page('dashboard');alert('Backup restored.')}catch(err){alert('Invalid backup file.')}};r.readAsText(file)}function exportCsv(){let rows=[['Invoice','Date','Customer','Payment','Total','COGS','Gross profit'],...db.sales.map(s=>[s.invoice,s.date,s.customer,s.payment,s.total,s.cogs,s.total-s.cogs])],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='sales-'+today()+'.csv';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('Delete ALL shop data stored in this browser? Export a backup first if needed.')){localStorage.removeItem(KEY);db=load();save();page('dashboard')}}
page('dashboard');
</script></body></html>
